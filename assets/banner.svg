<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 0 448 200" role="img" aria-label="ouija — AI agents you write in Go">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c39bff"/>
      <stop offset=".5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="w" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="152" y2="0">
      <stop offset="0" stop-color="#c39bff"/>
      <stop offset=".55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <g transform="translate(14 26) scale(1.27)">
    <!-- the planchette: broad top with a soft dip, the point down to the letter -->
    <path fill="url(#pg)" d="M21 8 C12 11 8 23 8 40 C8 64 24 93 50 116 C76 93 92 64 92 40 C92 23 88 11 79 8 C70 6 60 13 50 13 C40 13 30 6 21 8 Z"/>
    <path fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="2"
          transform="translate(50 60) scale(.88) translate(-50 -60)"
          d="M21 8 C12 11 8 23 8 40 C8 64 24 93 50 116 C76 93 92 64 92 40 C92 23 88 11 79 8 C70 6 60 13 50 13 C40 13 30 6 21 8 Z"/>
    <!-- two stars -->
    <g fill="#ffffff" fill-opacity=".85">
      <path d="M27 40 l1.5 3.5 3.5 1.5 -3.5 1.5 -1.5 3.5 -1.5 -3.5 -3.5 -1.5 3.5 -1.5 z"/>
      <path d="M73 40 l1.5 3.5 3.5 1.5 -3.5 1.5 -1.5 3.5 -1.5 -3.5 -3.5 -1.5 3.5 -1.5 z"/>
    </g>
    <!-- the window the answer shows through: a prompt -->
    <circle cx="50" cy="71" r="17" fill="#130926"/>
    <path d="M43 64 L50 71 L43 78" fill="none" stroke="#e7a6ff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M52.5 78 H59" stroke="#c4b5fd" stroke-width="5.5" stroke-linecap="round"/>
  </g>

  <!-- the name, one stroke per letter (no font: it looks the same everywhere) -->
  <g transform="translate(160 6) scale(1.62)">
    <g fill="none" stroke="url(#w)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="20" cy="52" r="16"/>
      <path d="M48 36 V54 A14 14 0 0 0 76 54 V36 M76 36 V68"/>
      <path d="M92 40 V68"/>
      <path d="M110 40 V80 A11 11 0 0 1 99 91"/>
      <circle cx="136" cy="52" r="16"/>
      <path d="M152 36 V68"/>
    </g>
    <circle cx="92" cy="22" r="5.6" fill="#c39bff"/>
    <circle cx="110" cy="22" r="5.6" fill="#8b5cf6"/>
  </g>

  <text x="287" y="190" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="19" font-weight="600" fill="#8f7cc4" letter-spacing=".3">AI agents you write in Go</text>
</svg>
