name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A new push to a PR supersedes the run in flight; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Actions are pinned to a commit SHA (the tag in the comment); Dependabot
# keeps them current (.github/dependabot.yml).
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: make fmt-check

      - name: go.mod / go.sum in sync
        run: make tidy-check

      - name: generated code up to date
        run: make gen-check

      - name: go vet (linux, darwin, windows)
        run: make cross-vet

      - name: staticcheck
        run: make lint

      - name: actionlint (workflows)
        run: make actionlint

      - name: test (race)
        run: make test-race

      - name: build
        run: make build

  # The release ships darwin and windows binaries, and the sandbox, symlink,
  # permission and bash code is OS-sensitive, so the tests run there too — as
  # a gate: a failure there turns the run red like one on Linux.
  test-os:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: test
        run: go test ./...

  # Separate job: a vulnerability published today should be visible on its own,
  # not hidden inside the lint/test gate.
  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: make vuln
