name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# A new push to a PR supersedes the run in flight; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Actions are pinned to a commit SHA (the tag in the comment); Dependabot
# keeps them current (.github/dependabot.yml).
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: make fmt-check

      - name: go.mod / go.sum in sync
        run: make tidy-check

      - name: generated code up to date
        run: make gen-check

      - name: go vet (linux, darwin, windows)
        run: make cross-vet

      - name: staticcheck
        run: make lint

      - name: actionlint (workflows)
        run: make actionlint

      - name: test (race)
        run: make test-race

      - name: build
        run: make build

  # The release ships darwin and windows binaries, and the sandbox, symlink,
  # permission and bash code is OS-sensitive, so the tests run there too — as
  # a gate: a failure there turns the run red like one on Linux.
  test-os:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: test
        run: go test ./...

  # The Windows installer end to end, against the latest release: download,
  # checksum, install, `ouija version` — in PowerShell 7 and in the 5.1 that
  # Windows ships. Its own job, and not a required check: it needs the network
  # and a published release, which a PR does not control.
  installer:
    name: install.ps1 (windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: PowerShell 7
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/install.ps1 -InstallDir "$env:RUNNER_TEMP\ouija7" -NoPath -RequireProvenance
          & "$env:RUNNER_TEMP\ouija7\ouija.exe" version

      - name: Windows PowerShell 5.1
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./scripts/install.ps1 -InstallDir "$env:RUNNER_TEMP\ouija5" -NoPath -RequireProvenance
          & "$env:RUNNER_TEMP\ouija5\ouija.exe" version

  # The same for install.sh, on Linux and macOS (Apple silicon), in the
  # POSIX sh it is written for.
  installer-unix:
    name: install.sh (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sh scripts/install.sh --require-provenance --dir "$RUNNER_TEMP/ouija"
          "$RUNNER_TEMP/ouija/ouija" version
          test -x "$RUNNER_TEMP/ouija/ouija-mcp"

  # Separate job: a vulnerability published today should be visible on its own,
  # not hidden inside the lint/test gate.
  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: make vuln
