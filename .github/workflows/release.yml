# Release pipeline — release-please + make dist.
#
# Flow (no manual version editing anywhere):
#   1. Push to main with Conventional Commits (feat/fix/perf/docs).
#   2. release-please opens/updates a "release" PR with the version bump,
#      the CHANGELOG.md section and the fallback in internal/version/version.go.
#   3. Merging that PR creates the tag vX.Y.Z + the GitHub Release.
#   4. This same workflow (same run, same token) then re-runs the gate on the
#      tag in a job with a read-only token, and only once it passes
#      cross-compiles the archives with `make dist`, attests their build
#      provenance and attaches them to the release.
#
# Artifacts run in the SAME workflow on purpose: releases created with the
# default GITHUB_TOKEN do not trigger other workflows (`on: release` would
# never fire). For the same reason GitHub holds the CI runs of the release PR
# for approval — and main's ruleset requires CI's checks — so this workflow
# approves them (below). Step 4 still gates the tag before any upload.
#
# Repo settings needed once: Settings → Actions → General →
#   "Allow GitHub Actions to create and approve pull requests".
name: release

on:
  push:
    branches: [main]

# Never cancel a release half-way (tag created, binaries missing).
concurrency:
  group: release
  cancel-in-progress: false

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  release-please:
    name: release PR → tag + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write # release-please labels its PR
      actions: write # approve CI on the release PR (below)
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The release PR needs CI's checks to merge, but GitHub holds the runs
      # of a PR the GITHUB_TOKEN pushed as "action required" until someone
      # approves them — and a separately dispatched run is not linked to the
      # PR, so it does not count. Approve those held runs: they run as the
      # PR's own checks. GitHub creates them a few seconds after the push,
      # hence the wait. A failure here only means approving them by hand
      # (the run's "Approve and run" button); it never fails the release.
      - name: Approve CI on the release PR
        if: steps.release.outputs.release_created != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: release-please--branches--main--components--ouija
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/branches/$BRANCH" --silent 2>/dev/null; then
            echo "no release PR open"
            exit 0
          fi
          head="$(gh api "repos/$GITHUB_REPOSITORY/branches/$BRANCH" -q .commit.sha)"
          for _ in $(seq 1 12); do
            ids="$(gh run list --repo "$GITHUB_REPOSITORY" --branch "$BRANCH" --status action_required \
              --json databaseId,headSha -q ".[] | select(.headSha == \"$head\") | .databaseId")"
            if [ -n "$ids" ]; then
              for id in $ids; do
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" --silent && echo "approved run $id"
              done
              exit 0
            fi
            sleep 10
          done
          echo "no run held for approval on $head (CI may have started on its own)"

  # The tests run code from the whole tree: they get a read-only token, not
  # the signing identity and release write access the next job holds.
  gate:
    name: gate (gofmt + vet + tests) on the tag
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Nothing from a shared cache in the release path.
          cache: false

      - name: Gate (gofmt + vet + tests) on the tagged commit
        run: make check

  artifacts:
    name: cross-compile + attest + attach binaries
    needs: [release-please, gate]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write     # upload release assets
      id-token: write     # sign the provenance attestation (Sigstore)
      attestations: write # store the attestation
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No shared cache in a job holding write tokens: a poisoned cache
          # entry from another workflow must not reach release binaries.
          cache: false

      - name: Build the release archives (5 targets)
        run: make dist VERSION="$TAG"

      # What ships must run and say the tag's version, and match its
      # checksums: a broken ldflags or archive stops here, before any upload.
      - name: Smoke-test the archives
        run: |
          v="${TAG#v}"
          (cd dist && sha256sum -c SHA256SUMS)
          tar -xzf "dist/ouija_${v}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          got="$("$RUNNER_TEMP/ouija_${v}_linux_amd64/ouija" version)"
          want="ouija $v"
          if [ "$got" != "$want" ]; then
            echo "::error::the binary says '$got', want '$want'"
            exit 1
          fi
          # grep without -q reads the whole listing: -q stops early, the
          # lister gets SIGPIPE and pipefail (on in Actions) fails a good one.
          for a in linux_arm64 darwin_amd64 darwin_arm64; do
            tar -tzf "dist/ouija_${v}_${a}.tar.gz" | grep "ouija_${v}_${a}/ouija" >/dev/null || { echo "::error::$a archive has no ouija binary"; exit 1; }
          done
          unzip -l "dist/ouija_${v}_windows_amd64.zip" | grep "ouija_${v}_windows_amd64/ouija.exe" >/dev/null || { echo "::error::the windows zip has no ouija.exe"; exit 1; }

      # Artifact attestations need a public repository (or GitHub Enterprise
      # Cloud): on a private one the step would fail and block the upload below.
      # It is skipped there, loudly: such a release ships with checksums only,
      # and the installer refuses it wherever it can check provenance.
      - name: Warn that the release has no build provenance
        if: github.event.repository.visibility != 'public'
        run: |
          msg="the repository is not public, so $TAG ships WITHOUT a build provenance attestation (checksums only); installers that verify provenance will refuse it"
          echo "::warning title=No build provenance::$msg"
          echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
          echo "> $msg" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
