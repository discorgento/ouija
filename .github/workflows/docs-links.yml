name: docs-links

# External links rot on their own schedule, not on ours: checking them on every
# push would turn an unrelated PR red when a third-party site is down. They run
# weekly, on demand, and on PRs that touch the docs.
on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

jobs:
  external-links:
    name: docs (external links)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: verify absolute http(s) links in the docs
        run: DOCCHECK_EXTERNAL=1 go test ./internal/doccheck -run TestExternalLinksReachable -v -count=1
