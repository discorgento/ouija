name: docs-links

# External links rot on their own schedule, not on ours: checking them on every
# push would turn an unrelated PR red when a third-party site is down. They run
# weekly, on demand, and on PRs that touch the docs.
on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

jobs:
  external-links:
    name: docs (external links)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: verify absolute http(s) links in the docs
        run: DOCCHECK_EXTERNAL=1 go test ./internal/doccheck -run TestExternalLinksReachable -v -count=1
